# Link Mini BLE bridge — ESPHome
# Reverse-engineered DuraCloud MQTT-over-BLE (zelfde familie als Dura-H17i)

substitutions:
  device_name: zwembad-link-mini
  friendly_name: Zwembad Link Mini
  link_mini_mac: !secret link_mini_mac
  svc_cmd: "682B3401-2EF9-4BB9-AD9B-28E228D41C1F"
  chr_write: "682B3402-2EF9-4BB9-AD9B-28E228D41C1F"
  chr_notify: "682B3403-2EF9-4BB9-AD9B-28E228D41C1F"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - link_mini_parser.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(program_busy).publish_state(false);
          id(program_settling).publish_state(false);
          id(memorize_pending) = false;
          id(on_queued) = false;
          // Na (her)start: baseline = huidige teller
          id(saved_program) = id(current_program);
      - script.execute: publish_current_program
      - delay: 8s
      - if:
          condition:
            switch.is_on: ble_bridge_enabled
          then:
            - script.execute: ble_connect_cycle

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5dB
  ap:
    ssid: "${device_name}-setup"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO
  logs:
    esp32_ble_client: INFO
    ble_client: INFO
    esp32_ble_tracker: WARN
    link_mini: INFO

esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 320ms
    window: 30ms

ble_client:
  - mac_address: ${link_mini_mac}
    id: link_ble
    auto_connect: false
    on_connect:
      then:
        - lambda: 'id(handshake_sent) = false;'
        - script.execute: ble_handshake_burst
    on_disconnect:
      then:
        - script.stop: ble_handshake_burst
        - lambda: |-
            id(ble_connected).publish_state(false);
            id(handshake_sent) = false;
            id(ble_status_received) = false;
            id(program_source_text).publish_state("Niet verbonden");
        - delay: 30s
        - if:
            condition:
              and:
                - switch.is_on: ble_bridge_enabled
                - binary_sensor.is_off: ble_connected
            then:
              - script.execute: ble_connect_cycle

globals:
  - id: handshake_sent
    type: bool
    restore_value: no
    initial_value: "false"
  # Vision Spectra RGB programma 1–11 (handleiding p.15); sync → 6 = blauw
  - id: current_program
    type: int
    restore_value: yes
    initial_value: "6"
  # Laatste kleur in lamp-NVM (Spectra: UIT ≥20s min.; wij gebruiken 30s)
  - id: saved_program
    type: int
    restore_value: yes
    initial_value: "6"
  - id: pending_target
    type: int
    restore_value: no
    initial_value: "6"
  # Snapshot voor advance_to_program — niet mid-flight overschrijven via pending_target
  - id: advance_target
    type: int
    restore_value: no
    initial_value: "6"
  - id: program_steps
    type: int
    restore_value: no
    initial_value: "0"
  - id: ble_status_received
    type: bool
    restore_value: no
    initial_value: "false"
  - id: sync_in_progress
    type: bool
    restore_value: no
    initial_value: "false"
  # True terwijl we wachten op UIT ≥30s om te memoriseren
  - id: memorize_pending
    type: bool
    restore_value: no
    initial_value: "false"
  # HA AAN ingedrukt tijdens de 30s UIT — pas aanschakelen na memorize
  - id: on_queued
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: publish_current_program
    then:
      - lambda: |-
          const float p = id(current_program);
          id(current_program_sensor).publish_state(p);
          id(current_program_set).publish_state(p);

  # Spectra: UIT ≥30s memoriseert. Alleen starten vanuit write_lights_off (HA),
  # niet vanuit BLE-notifies — die gaven 's nachts valse opslaan-pulsen.
  - id: start_memorize_off
    mode: restart
    then:
      - lambda: |-
          id(memorize_pending) = true;
          id(program_settling).publish_state(true);
          ESP_LOGI("link_mini", "Memorize-timer 30s UIT — live=%d opgeslagen=%d",
                   id(current_program), id(saved_program));
      - delay: 30s
      - lambda: |-
          id(saved_program) = id(current_program);
          id(memorize_pending) = false;
          id(program_settling).publish_state(false);
          ESP_LOGI("link_mini", "Spectra: kleur opgeslagen na UIT ≥30s → %d", id(saved_program));
      - if:
          condition:
            lambda: 'return id(on_queued);'
          then:
            - lambda: 'id(on_queued) = false;'
            - logger.log:
                level: INFO
                format: "AAN na 30s UIT — zelfde kleur"
            - script.execute: write_lights_on

  - id: on_lights_turned_off
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(sync_in_progress) || (id(program_busy).has_state() && id(program_busy).state);'
          then:
            - logger.log:
                level: INFO
                format: "UIT tijdens sync/pulse — memorize overgeslagen"
          else:
            - script.execute: start_memorize_off

  # BLE/OneTouch AAN tijdens memorize: timer annuleren, teller NIET +1.
  # (Valse notifies hielden de teller 's nachts omhoog; volgende kleur alleen via pulse/chips.)
  - id: on_lights_turned_on
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(memorize_pending);'
          then:
            - script.stop: start_memorize_off
            - lambda: |-
                id(memorize_pending) = false;
                id(on_queued) = false;
                id(program_settling).publish_state(false);
                ESP_LOGW("link_mini", "AAN tijdens memorize — timer gestopt, teller blijft %d",
                         id(current_program));
            - script.execute: publish_current_program

  # Handmatige kalibratie = lamp én geheugen kloppen → meteen als opgeslagen markeren
  - id: mark_program_saved
    then:
      - script.stop: start_memorize_off
      - lambda: |-
          id(memorize_pending) = false;
          id(on_queued) = false;
          id(saved_program) = id(current_program);
          id(program_settling).publish_state(false);
          ESP_LOGI("link_mini", "Teller/kalibratie → opgeslagen=%d", id(saved_program));
      - script.execute: publish_current_program

  # sniffer2: CONNECT×2 → SUB group 1 (Lights) 042202080100
  - id: ble_handshake_burst
    mode: restart
    then:
      - delay: 700ms
      - ble_client.ble_write:
          id: link_ble
          service_uuid: ${svc_cmd}
          characteristic_uuid: ${chr_write}
          value: [0x02, 0x0A, 0x01, 0x00]
      - delay: 350ms
      - ble_client.ble_write:
          id: link_ble
          service_uuid: ${svc_cmd}
          characteristic_uuid: ${chr_write}
          value: [0x02, 0x0A, 0x01, 0x00]
      - delay: 250ms
      - ble_client.ble_write:
          id: link_ble
          service_uuid: ${svc_cmd}
          characteristic_uuid: ${chr_write}
          value: [0x04, 0x22, 0x02, 0x08, 0x01, 0x00]
      - delay: 250ms
      - ble_client.ble_write:
          id: link_ble
          service_uuid: ${svc_cmd}
          characteristic_uuid: ${chr_write}
          value: [0x04, 0x22, 0x02, 0x08, 0x01, 0x00]
      - delay: 400ms
      # group 2 (Lights live) — experimenteel; app gebruikt group 1
      - ble_client.ble_write:
          id: link_ble
          service_uuid: ${svc_cmd}
          characteristic_uuid: ${chr_write}
          value: [0x04, 0x22, 0x02, 0x08, 0x02, 0x00]
      - delay: 1500ms
      - script.execute: ble_sync_after_connect

  - id: ble_sync_after_connect
    then:
      - lambda: |-
          id(ble_connected).publish_state(true);
          id(ble_status_received) = false;
          ESP_LOGI("link_mini", "BLE connect — programma %d uit ESP geheugen", id(current_program));
      - script.execute: publish_current_program
      - lambda: 'id(program_source_text).publish_state("ESP geheugen");'

  - id: ble_connect_cycle
    mode: single
    then:
      - if:
          condition:
            switch.is_on: ble_bridge_enabled
          then:
            - esp32_ble_tracker.stop_scan:
            - delay: 1s
            - ble_client.disconnect: link_ble
            - delay: 2s
            - ble_client.connect: link_ble

  # AAN: sniffer2 — group 2 field 5 bool true
  - id: write_lights_on
    then:
      - ble_client.ble_write:
          id: link_ble
          service_uuid: ${svc_cmd}
          characteristic_uuid: ${chr_write}
          value: [0x04, 0x1A, 0x08, 0x08, 0x02, 0x10, 0x05, 0x1A, 0x02, 0x08, 0x01, 0x00]
      - lambda: 'id(lights_power).publish_state(true);'

  # HA-schakelaar: niet AAN sturen tijdens de 30s UIT (dat is volgende kleur)
  - id: request_lights_on
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(memorize_pending);'
          then:
            - lambda: 'id(on_queued) = true;'
            - logger.log:
                level: INFO
                format: "AAN uitgesteld — eerst UIT ≥30s zodat de kleur blijft"
          else:
            - lambda: 'id(on_queued) = false;'
            - script.execute: write_lights_on

  # UIT: sniffer4 @ 18.76s — group 2 field 4 bool true → notify eindigt op 0825 (uit)
  - id: write_lights_off
    then:
      - logger.log:
          level: INFO
          format: "UIT: field4=true hex=041a08080210041a02080100 ble=%s"
          args: ['id(ble_connected).state ? "connected" : "DISCONNECTED"']
      - lambda: 'id(on_queued) = false;'
      - ble_client.ble_write:
          id: link_ble
          service_uuid: ${svc_cmd}
          characteristic_uuid: ${chr_write}
          value: [0x04, 0x1A, 0x08, 0x08, 0x02, 0x10, 0x04, 0x1A, 0x02, 0x08, 0x01, 0x00]
      - lambda: 'id(lights_power).publish_state(false);'
      - script.execute: on_lights_turned_off

  # Volgende programma: group 6 field 5 (3201) — sniffer3 ×39
  # Teller meteen na BLE-write bijwerken (niet na de delay), anders desync.
  # Geen increment als BLE weg — voorkomt permanente teller-desync.
  - id: write_next_program_pulse
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: ble_connected
          then:
            - ble_client.ble_write:
                id: link_ble
                service_uuid: ${svc_cmd}
                characteristic_uuid: ${chr_write}
                value: [0x04, 0x1A, 0x08, 0x08, 0x06, 0x10, 0x05, 0x1A, 0x02, 0x32, 0x01, 0x00]
            - lambda: |-
                id(current_program) = (id(current_program) % 11) + 1;
                id(lights_power).publish_state(true);
                ESP_LOGI("link_mini", "Volgende programma → %d", id(current_program));
            - script.execute: publish_current_program
            - delay: 2.5s
          else:
            - lambda: |-
                id(program_steps) = 0;
                ESP_LOGW("link_mini", "Pulse overgeslagen — BLE niet verbonden (teller blijft %d)", id(current_program));

  # Dunne wrapper: één busy-owner = advance_to_program
  - id: write_next_program
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(program_busy).state;'
          then:
            - logger.log:
                level: WARN
                format: "Volgende geweigerd — programma bezig"
          else:
            - lambda: 'id(pending_target) = (id(current_program) % 11) + 1;'
            - script.execute: advance_to_program
            - script.wait: advance_to_program

  - id: write_prev_program
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(program_busy).state;'
          then:
            - logger.log:
                level: WARN
                format: "Vorig geweigerd — programma bezig"
          else:
            - lambda: |-
                id(pending_target) = id(current_program) - 1;
                if (id(pending_target) < 1) id(pending_target) = 11;
                ESP_LOGI("link_mini", "Vorig programma → %d", id(pending_target));
            - script.execute: advance_to_program
            - script.wait: advance_to_program

  # Spectra handleiding p.16 — sync landt niet altijd exact op 6; teller start op 5 (caribisch blauw)
  - id: sync_program_blue
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(program_busy).state;'
          then:
            - logger.log:
                level: WARN
                format: "Sync geweigerd — programma bezig"
          else:
            - lambda: 'id(program_busy).publish_state(true);'
            - lambda: 'id(sync_in_progress) = true;'
            - logger.log:
                level: INFO
                format: "Sync Spectra: uit 25s, 2x puls, aan"
            - script.execute: write_lights_off
            - lambda: 'id(lights_power).publish_state(false);'
            - delay: 25s
            - script.execute: write_lights_on
            - delay: 2s
            - script.execute: write_lights_off
            - lambda: 'id(lights_power).publish_state(false);'
            - delay: 2s
            - script.execute: write_lights_on
            - delay: 2s
            - script.execute: write_lights_off
            - lambda: 'id(lights_power).publish_state(false);'
            - delay: 2s
            - script.execute: write_lights_on
            - lambda: |-
                id(lights_power).publish_state(true);
                id(current_program) = 5;
                id(saved_program) = 5;
                id(memorize_pending) = false;
                id(sync_in_progress) = false;
                ESP_LOGI("link_mini", "Sync klaar — teller=5. Zie je blauw? Teller blauw. Zie caribisch? Kleur blauw.");
            - script.stop: start_memorize_off
            - lambda: 'id(program_settling).publish_state(false);'
            - script.execute: publish_current_program
            - lambda: 'id(program_busy).publish_state(false);'

  - id: calibrate_program
    then:
      - lambda: |-
          ESP_LOGI("link_mini", "Teller handmatig → %d", id(current_program));
      - script.execute: publish_current_program

  - id: calibrate_program_blue
    then:
      - if:
          condition:
            lambda: 'return id(program_busy).state;'
          then:
            - logger.log:
                level: WARN
                format: "Teller 6 geweigerd — programma bezig"
          else:
            - lambda: |-
                id(current_program) = 6;
                ESP_LOGI("link_mini", "Teller = 6 (blauw)");
            - script.execute: mark_program_saved

  - id: calibrate_program_green
    then:
      - if:
          condition:
            lambda: 'return id(program_busy).state;'
          then:
            - logger.log:
                level: WARN
                format: "Teller 7 geweigerd — programma bezig"
          else:
            - lambda: |-
                id(current_program) = 7;
                ESP_LOGI("link_mini", "Teller = 7 (groen)");
            - script.execute: mark_program_saved

  # Enige eigenaar van program_busy voor kleurwisselingen.
  # advance_target is snapshot — pending_target mag daarna niet meer storen.
  - id: advance_to_program
    mode: single
    then:
      - lambda: 'id(program_busy).publish_state(true);'
      - lambda: |-
          const int cur = id(current_program);
          id(advance_target) = id(pending_target);
          if (id(advance_target) < 1) id(advance_target) = 1;
          if (id(advance_target) > 11) id(advance_target) = 11;
          id(program_steps) = (id(advance_target) - cur + 11) % 11;
          ESP_LOGI("link_mini", "Programma %d → %d (%d stappen)", cur, id(advance_target), id(program_steps));
      - while:
          condition:
            lambda: 'return id(current_program) != id(advance_target) && id(program_steps) > 0 && id(ble_connected).state;'
          then:
            - script.execute: write_next_program_pulse
            - script.wait: write_next_program_pulse
            - lambda: 'id(program_steps) = id(program_steps) - 1;'
      - lambda: |-
          id(program_busy).publish_state(false);
          ESP_LOGI("link_mini", "Advance klaar — teller=%d (target=%d)", id(current_program), id(advance_target));
      # Nieuwe live-kleur nog niet in NVM — pas na UIT ≥30s
      - lambda: |-
          id(program_settling).publish_state(id(current_program) != id(saved_program));
binary_sensor:
  - platform: template
    name: "BLE verbonden"
    id: ble_connected
    device_class: connectivity

  - platform: template
    name: "Lampen aan"
    id: lights_power
    icon: mdi:lightbulb-on

  # Blokkeert Prog +/- (en UI) tijdens/na een programmasstap
  - platform: template
    name: "Programma bezig"
    id: program_busy
    icon: mdi:timer-sand
    device_class: running

  # Aan tijdens UIT≥30s (kleur opslaan) of terwijl AAN is uitgesteld
  - platform: template
    name: "Kleur opslaan"
    id: program_settling
    icon: mdi:content-save-clock
    device_class: running

sensor:
  - platform: template
    name: "Lamp programma"
    id: current_program_sensor
    icon: mdi:numeric
    unit_of_measurement: "/11"
    accuracy_decimals: 0
    lambda: 'return id(current_program);'

  - platform: ble_client
    type: characteristic
    ble_client_id: link_ble
    internal: true
    id: link_notify_sink
    service_uuid: ${svc_cmd}
    characteristic_uuid: ${chr_notify}
    notify: true
    lambda: |-
      const auto &data = x;
      if (data.empty()) return 0.0f;
      id(ble_connected).publish_state(true);
      if (!id(handshake_sent)) {
        id(handshake_sent) = true;
        ESP_LOGI("link_mini", "NOTIFY len=%u", (unsigned) data.size());
      }
      bool power_on = false;
      // Power alleen uit korte notifies — grote state-pakketten gaven false AAN/UIT.
      if (!link_mini::is_full_state_notify(data) && link_mini::parse_power(data, power_on)) {
        const bool was_on = id(lights_power).has_state() && id(lights_power).state;
        if (power_on != was_on) {
          id(lights_power).publish_state(power_on);
          ESP_LOGI("link_mini", "BLE power %s→%s (len=%u)", was_on ? "aan" : "uit",
                   power_on ? "aan" : "uit", (unsigned) data.size());
        }
        if (id(sync_in_progress) || (id(program_busy).has_state() && id(program_busy).state)) {
          // Pulse/sync — geen memorize/teller
        } else if (was_on && !power_on) {
          // Externe UIT (OneTouch): UI bijwerken, geen memorize (alleen HA-UIT start die)
          ESP_LOGI("link_mini", "Externe UIT — memorize niet gestart (alleen via HA-schakelaar)");
        } else if (!was_on && power_on) {
          // Externe AAN: eventueel memorize-timer stoppen, nooit teller +1
          id(on_lights_turned_on).execute();
        }
      }
      if (link_mini::is_full_state_notify(data)) {
        id(ble_status_received) = true;
        int r = 0, g = 0, b = 0;
        if (link_mini::parse_color_rgb(data, r, g, b)) {
          // Link Mini stuurt vaste/stale RGB (sniffer: verandert niet bij kleurwissel) — teller niet overschrijven
          ESP_LOGI("link_mini", "BLE RGB %d,%d,%d (niet gebruikt voor teller, staat=%d)", r, g, b, id(current_program));
        }
        id(program_source_text).publish_state("ESP geheugen");
      }
      return 0.0f;

text_sensor:
  - platform: template
    name: "Programma bron"
    id: program_source_text
    icon: mdi:source-branch
    lambda: 'return std::string("ESP geheugen");'

text:
  # Alleen-lezen uitleg op HA-apparaatpagina (Bediening)
  - platform: template
    name: "Kalibratie handleiding"
    id: calib_guide
    icon: mdi:book-open-page-variant
    mode: text
    min_length: 0
    max_length: 255
    optimistic: true
    initial_value: |-
      De lamp meldt programma niet via BLE. HA telt in ESP-geheugen.
      SNEL: Huidig programma = kleur op lamp (1-11).
      SYNC: Sync blauw (~30 s), dan Teller 6 blauw bij echte blauw.
      TIP: bedien via HA (niet OneTouch voor kleurwissel — teller volgt die niet).
    set_action:
      - text.set:
          id: calib_guide
          value: |-
            De lamp meldt programma niet via BLE. HA telt in ESP-geheugen.
            SNEL: Huidig programma = kleur op lamp (1-11).
            SYNC: Sync blauw (~30 s), dan Teller 6 blauw bij echte blauw.
            TIP: bedien via HA (niet OneTouch voor kleurwissel — teller volgt die niet).

switch:
  - platform: template
    name: "BLE bridge"
    id: ble_bridge_enabled
    icon: mdi:bluetooth-connect
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: ble_connect_cycle
    turn_off_action:
      - script.stop: ble_handshake_burst
      - ble_client.disconnect: link_ble

  - platform: template
    name: "Zwembad lampen"
    id: pool_lights
    icon: mdi:light-recessed
    optimistic: false
    lambda: |-
      return id(lights_power).has_state() && id(lights_power).state;
    turn_on_action:
      - script.execute: request_lights_on
    turn_off_action:
      - script.execute: write_lights_off

number:
  # Zet op het programma dat je NU ziet (1–11) vóór je kleurknoppen gebruikt
  - platform: template
    name: "Huidig programma"
    id: current_program_set
    icon: mdi:counter
    min_value: 1
    max_value: 11
    step: 1
    mode: box
    lambda: 'return id(current_program);'
    set_action:
      - if:
          condition:
            lambda: 'return id(program_busy).state;'
          then:
            - logger.log:
                level: WARN
                format: "Huidig programma geweigerd — bezig"
            - script.execute: publish_current_program
          else:
            - lambda: |-
                id(current_program) = (int) x;
                ESP_LOGI("link_mini", "Huidig programma ingesteld op %d", id(current_program));
            - script.execute: mark_program_saved
            - lambda: 'id(program_source_text).publish_state("Handmatig");'

button:
  - platform: template
    name: "Sync naar blauw"
    id: sync_blue
    icon: mdi:sync
    on_press:
      - script.execute: sync_program_blue

  - platform: template
    name: "Teller 6 🔵 blauw"
    id: calibrate_blue
    icon: mdi:target
    on_press:
      - script.execute: calibrate_program_blue

  - platform: template
    name: "Teller 7 🟢 groen"
    id: calibrate_green
    icon: mdi:target
    on_press:
      - script.execute: calibrate_program_green

  - platform: template
    name: "Volgende programma"
    id: next_program
    icon: mdi:skip-next
    on_press:
      - script.execute: write_next_program

  - platform: template
    name: "Vorig programma"
    id: prev_program
    icon: mdi:skip-previous
    on_press:
      - script.execute: write_prev_program

  # Spectra programma 1–11 — alleen starten als niet bezig (pending_target niet mid-flight overschrijven)
  - platform: template
    name: "1 🕯️ Kaarslicht"
    on_press:
      - if:
          condition:
            lambda: 'return !id(program_busy).state;'
          then:
            - lambda: 'id(pending_target) = 1;'
            - script.execute: advance_to_program
          else:
            - logger.log:
                level: WARN
                format: "Kleur 1 geweigerd — bezig"

